# Example server configuration. Copy to server.yaml and edit for your environment.
# All keys below are required per docs/rtmp_promot.md "Configuration" section.

rtmp_bind_address: "0.0.0.0"
rtmp_port: 1935
api_bind_address: "127.0.0.1"
api_port: 8080
public_rtmp_hostname: "stream.example.com"

ring_queue_depth: 1024
completion_batch_size: 64
submission_batch_size: 64
# 0 = auto-detect from hardware concurrency (clamped to max_worker_ring_count
# below); set explicitly to pin the worker count instead.
worker_ring_count: 0
max_worker_ring_count: 64
worker_cpu_pinning_enabled: true

enable_multishot_accept: true
enable_multishot_recv: true
enable_registered_buffers: true
enable_provided_buffer_ring: true
enable_send_zero_copy: true
enable_sqpoll: true
sqpoll_idle_ms: 1000

registered_buffer_count: 1024
registered_buffer_size: 65536
provided_buffer_count: 4096
provided_buffer_size: 65536

maximum_connections: 2000000
maximum_connections_per_ip: 2000000
maximum_publishers: 1000
maximum_viewers_per_stream: 2000000

input_chunk_size: 128
output_chunk_size: 4096
maximum_rtmp_message_size: 10485760

handshake_timeout: 5s
authentication_timeout: 5s
idle_timeout: 60s
write_timeout: 10s
publisher_inactivity_timeout: 30s

gop_cache_max_duration: 10s
gop_cache_max_bytes: 16777216
gop_cache_max_packets: 2000

subscriber_queue_max_bytes: 8388608
subscriber_queue_max_packets: 1000

recording_directory: "./recordings"
recording_enabled: false
recording_max_size: 4294967296
recording_queue_max_bytes: 16777216

database_type: "sqlite"
database_connection: "./data/rtmp.db"

# Transcoding is an independent worker process. Rules are loaded once during
# server startup from the pipe-delimited preset file.
transcoding_enabled: false
transcoding_preset_file: "./config/transcoding.conf"
transcoding_ffmpeg_path: "/usr/bin/ffmpeg"
transcoding_max_active_jobs: 16
transcoding_max_outputs_per_job: 16
transcoding_max_restart_attempts: 5

# Public cached HLS mode. Every viewer gets a lightweight playback session for
# edge counting, while all viewers share the same immutable Varnish segment
# objects. Origin delivery-stat locking stays disabled; viewer and bandwidth
# totals come from viewer-estimator.service at the cache edge.
hls_high_scale_mode: true

# CHANGE THESE before production use. Never commit real secrets.
token_signing_secret: "CHANGE_ME"
api_authentication_secret: "CHANGE_ME"

log_level: "info"
metrics_enabled: true
