# Example server configuration. Copy to server.yaml and edit for your environment.
# All keys below are required per docs/rtmp_promot.md "Configuration" section.

rtmp_bind_address: "0.0.0.0"
rtmp_port: 1935
api_bind_address: "127.0.0.1"
api_port: 8080
public_rtmp_hostname: "stream.example.com"

ring_queue_depth: 1024
completion_batch_size: 64
submission_batch_size: 64
# 0 = auto-detect from hardware concurrency (clamped to max_worker_ring_count
# below); set explicitly to pin the worker count instead.
worker_ring_count: 0
max_worker_ring_count: 64
# Safe cloud/VPS default. The installer enables pinning automatically only
# on bare metal, where the scheduler topology is stable.
worker_cpu_pinning_enabled: false

enable_multishot_accept: true
enable_multishot_recv: true
enable_registered_buffers: true
enable_provided_buffer_ring: true
enable_send_zero_copy: true
# Avoid one dedicated polling thread per ring on shared/virtual CPUs. The
# installer enables SQPOLL automatically on bare metal.
enable_sqpoll: false
sqpoll_idle_ms: 1000

registered_buffer_count: 1024
registered_buffer_size: 65536
provided_buffer_count: 4096
provided_buffer_size: 65536

# Per-connection transport tuning (Wowza "Tune for optimal performance").
# 0 = let the kernel autosize the buffer (throughput-optimal on a
# well-provisioned link). A non-zero send buffer bounds per-viewer kernel
# memory at high fan-out and makes a slow receiver visible to the write
# queue sooner. notsent_lowat caps unsent bytes the kernel holds before the
# socket stops reporting writable, so pacing runs against a small queue; it
# must not exceed client_send_buffer_bytes and is ignored where the kernel
# lacks TCP_NOTSENT_LOWAT.
client_send_buffer_bytes: 262144
client_receive_buffer_bytes: 0
client_tcp_notsent_lowat_bytes: 131072

# Unbounded (uint32 max) by request -- no admission cap at any of these
# layers. See ServerConfig in include/rtmp_server/core/config.hpp for the
# DoS-protection tradeoff this removes.
maximum_connections: 4294967295
maximum_connections_per_ip: 4294967295
maximum_publishers: 4294967295
maximum_viewers_per_stream: 4294967295

input_chunk_size: 128
output_chunk_size: 4096
maximum_rtmp_message_size: 10485760

# Fast join: a fresh open of any stream's master.m3u8 redirects straight to
# its lowest-bitrate rendition instead of serving the master playlist.
enable_hls_fast_join: false

# Multi-node HLS: leave empty on a single-box install. Set it (>= 16 chars,
# same value on every edge) when this origin sits behind its own edge/shield
# Varnish tier so /hls is served only to requests carrying X-Edge-Token.
# See docs/multi-node-hls.md.
hls_edge_fetch_secret: ""

handshake_timeout: 5s
authentication_timeout: 5s
idle_timeout: 60s
write_timeout: 10s
publisher_inactivity_timeout: 30s

gop_cache_max_duration: 10s
gop_cache_max_bytes: 16777216
gop_cache_max_packets: 2000

# About 3-6 seconds at common live bitrates: enough burst absorption without
# allowing thousands of slow viewers to retain many GiB before recovery.
subscriber_queue_max_bytes: 4194304
subscriber_queue_max_packets: 512

recording_directory: "./recordings"
recording_enabled: false
recording_max_size: 4294967296
recording_queue_max_bytes: 16777216

database_type: "sqlite"
database_connection: "./data/rtmp.db"


# Public cached HLS mode. Every viewer gets a lightweight playback session for
# edge counting. Session-bearing media playlists are micro-cached with no
# viewer state in their body, and all viewers share immutable Varnish segment
# objects. Origin delivery-stat locking stays disabled; viewer and bandwidth
# totals come from viewer-estimator.service at the cache edge.
hls_high_scale_mode: true

# Per-link viewer counting. Varnish collapses every viewer's playlist polls
# into roughly one origin request per second, so the origin cannot see how
# many people are watching a link; viewer-estimator.service does, and writes
# its per-link counts here every two seconds. The server reads this file so
# its own API reports the real viewer count for each link. Set to an empty
# string on a deployment with no cache edge.
edge_viewer_stats_path: "/var/www/streamforge/internal/viewer_estimate.json"

# CHANGE THESE before production use. Never commit real secrets.
token_signing_secret: "CHANGE_ME"
api_authentication_secret: "CHANGE_ME"

log_level: "info"
metrics_enabled: true
