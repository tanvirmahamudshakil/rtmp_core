# StreamForge transcoding rules
#
# One preset per line:
# source | preset | output | backend | video-codec | video-bitrate | profile |
# keyframes | width | height | fit-mode | audio-codec | audio-bitrate | gpu | description
#
# backend:    default/software, nvenc, quicksync/qsv, beamr, mainconcept
# video:      h264 is currently supported by the RTMP/HLS origin
# keyframes:  source or a frame count
# dimensions: leave empty to keep the source dimensions
# gpu:        first or a zero-based GPU ID
#
# Full adaptive ladder. Remove outputs above the source resolution when the
# source cannot supply them; upscaling adds encoder load without adding detail.
# The 720p/480p/360p video rates retain the requested 1000/500/490 Kbps:
# football/live2|2160p|live2_2160p|default|h264|12000000|high|60|3840|2160|letterbox|aac|256000|first|4K output
# football/live2|1440p|live2_1440p|default|h264|6000000|high|60|2560|1440|letterbox|aac|192000|first|QHD output
# football/live2|1080p|live2_1080p|default|h264|3000000|high|60|1920|1080|letterbox|aac|160000|first|Full HD output
# football/live2|720p|live2_720p|default|h264|1000000|high|60|1280|720|letterbox|aac|128000|first|HD output
# football/live2|540p|live2_540p|default|h264|750000|main|60|960|540|letterbox|aac|96000|first|qHD output
# football/live2|480p|live2_480p|default|h264|500000|main|60|854|480|letterbox|aac|96000|first|Mobile output
# football/live2|360p|live2_360p|default|h264|490000|main|60|640|360|letterbox|aac|64000|first|Low-bandwidth output
# football/live2|240p|live2_240p|default|h264|250000|baseline|60|426|240|letterbox|aac|48000|first|Very low-bandwidth output
# football/live2|144p|live2_144p|default|h264|120000|baseline|60|256|144|letterbox|aac|32000|first|Minimum-bandwidth output
#
# An application wildcard is also supported. Managed output streams are
# automatically excluded, so wildcard rules cannot recursively transcode
# their own renditions:
# football/*|mobile|{source}_480p|default|h264|900000|main|60|854|480|letterbox|aac|96000|first|Mobile output

# --- Far / mobile / lossy audience ladder (first-data-fast) --------------
# Problem: one origin, viewers on high-RTT lossy links, no CDN. A single
# ~700 Kbps 480p rung means a slow viewer's TCP flow never keeps up -> the
# player buffers forever. Fix: give the player small rungs it CAN pull, and
# a tiny bottom rung so the FIRST segment lands almost immediately. Pair
# with enable_hls_fast_join: true (server.yaml) so a fresh open starts on
# 144p and the player's ABR climbs from there.
#
# 2 s keyframes so segments stay ~2 s (small transfers survive loss). Copy
# these lines (drop the leading "# ") into the live transcoding.conf, then
# restart rtmp-server. Replace "kk/kk" with the real publish app/stream.
#
# kk/kk|360p|kk_360p|default|h264|400000|main|48|640|360|letterbox|aac|64000|first|Low-bandwidth
# kk/kk|240p|kk_240p|default|h264|220000|baseline|48|426|240|letterbox|aac|48000|first|Very low-bandwidth
# kk/kk|144p|kk_144p|default|h264|110000|baseline|48|256|144|letterbox|aac|32000|first|First-data-fast bottom rung
#
# Keep the existing 480p rung too, so a good connection still gets it.
