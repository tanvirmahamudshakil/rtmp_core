# StreamForge transcoding rules
#
# One preset per line:
# source | preset | output | backend | video-codec | video-bitrate | profile |
# keyframes | width | height | fit-mode | audio-codec | audio-bitrate | gpu | description
#
# backend:    default/software, nvenc, quicksync/qsv, beamr, mainconcept
# video:      h264 is currently supported by the RTMP/HLS origin
# keyframes:  source or a frame count
# dimensions: leave empty to keep the source dimensions
# gpu:        first or a zero-based GPU ID
#
# Exact source rule example:
# football/live2|720p|live2_720p|default|h264|2500000|high|60|1280|720|letterbox|aac|128000|first|HD output
#
# An application wildcard is also supported. Managed output streams are
# automatically excluded, so wildcard rules cannot recursively transcode
# their own renditions:
# football/*|mobile|{source}_480p|default|h264|900000|main|60|854|480|letterbox|aac|96000|first|Mobile output
