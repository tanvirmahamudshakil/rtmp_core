# StreamForge runs on small dedicated VPS root filesystems. Keep diagnostic
# history bounded so a traffic spike or restart loop cannot consume the space
# needed by SQLite and the playback-session estimator.
[Journal]
SystemMaxUse=128M
SystemKeepFree=1G
SystemMaxFileSize=32M
RuntimeMaxUse=64M
RuntimeKeepFree=512M
RuntimeMaxFileSize=16M
MaxRetentionSec=7day
